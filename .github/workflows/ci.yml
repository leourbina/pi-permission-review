name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the manifest and entry points
        run: node scripts/check-manifest.mjs

      - name: Verify the published tarball
        run: npm pack --dry-run
